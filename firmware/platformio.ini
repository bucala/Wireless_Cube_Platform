; ---------------------------------------------------------------------------
;  NFC Dice Debugger - ESP32-S3 firmware
;  Target: ESP32-S3-WROOM-1 N16R8 (16 MB QIO flash, 8 MB OPI PSRAM)
;  Reader: NXP PN5180 on hardware SPI (FSPI / SPI2_HOST)
; ---------------------------------------------------------------------------

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; --- N16R8 memory layout -------------------------------------------------
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  ; Wi-Fi credentials can be injected here instead of using include/secrets.h
  ; -DWIFI_SSID=\"my-network\"
  ; -DWIFI_PASS=\"my-password\"

lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  ESP32Async/AsyncTCP@^3.3.2
  ESP32Async/ESPAsyncWebServer@^3.6.0

; Native (host) environment used by `pio test -e native` for the pure-logic
; unit tests (DPC decision table, UID formatting, dice math).
[env:native]
platform = native
build_flags = -std=gnu++17 -DUNIT_TEST_NATIVE
test_framework = unity
lib_deps =
