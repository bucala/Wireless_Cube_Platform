[package]
name = "nfc-dice-debugger"
version = "1.0.0"
description = "Desktop shell for the NFC Dice Debugger dashboard"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.7", features = ["dialog-open", "dialog-save", "fs-read-file", "fs-write-file"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Enabled by `tauri build` to keep the console window hidden on Windows.
custom-protocol = ["tauri/custom-protocol"]
